name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + eval, offline)
    runs-on: ubuntu-latest
    env:
      # CI must never reach Azure: no AZURE_OPENAI_ENDPOINT -> offline matcher fallback (ADR 0003).
      AZURE_OPENAI_ENDPOINT: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests
        working-directory: backend
        run: pytest -q
      - name: Quality evaluation (sponsor gates)
        if: hashFiles('eval/run_eval.py', 'backend/eval/run_eval.py') != ''
        run: |
          if [ -f eval/run_eval.py ]; then python eval/run_eval.py; else (cd backend && python eval/run_eval.py); fi
      - name: Upload eval report
        if: always() && hashFiles('docs/quality/eval-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: docs/quality/eval-report.md
          if-no-files-found: warn

  frontend:
    name: frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: transferiq-web
          path: frontend/dist/transferiq-web/browser
          if-no-files-found: error
          retention-days: 7

  infra:
    name: infra (bicep build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep (no Azure login needed)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

  log-check:
    # Rule: a push/PR that changes backend/, frontend/src/ or infra/ must also touch ai-logs/
    # in the same range (AGENTS.md "Logging is mandatory"). Logic: scripts/check_ai_logs.sh
    name: ai-log check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that code changes come with an AI log
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check_ai_logs.sh "$BASE_SHA" "$HEAD_SHA"
