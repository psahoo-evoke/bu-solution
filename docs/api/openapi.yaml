openapi: 3.0.3
info:
  title: TransferIQ API
  version: 0.8.0
  description: |
    Transfer credit evaluation co-pilot (EvoHack 2026, BU problem statement).
    AI recommends, the rules engine computes, evaluators decide.
    Demo auth: send `X-Demo-Role` (Student | CreditStaff | Evaluator | Department | Registrar | Advisor).
    Production auth: Entra ID bearer token with the same app roles.
    Default deny (ADR 0005) with a public allowlist: /health, /auth/* (sign-in and registration) and the credit check and chat (/credit-check, /credit-check/schools, /credit-check/courses, /credit-chat; ADR 0006) need no login. Every other route requires a valid role; `x-roles` lists the roles allowed per operation (others get 403, missing/unknown role 401).
    In production, Student may only read or upload for their own student_id; /demo/reset is disabled.
servers:
  - url: /api
security:
  - demoRole: []
  - bearer: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
  /credit-check/schools:
    get:
      summary: "Public, no login (ADR 0006): schools in the catalog (for the credit-check form and chat)"
      security: []
      responses:
        "200": { description: Schools, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CreditSchool" } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /credit-check/courses:
    get:
      summary: "Public, no login (ADR 0006): a school's catalog courses for the form's course picker. Courses known only from a transcript upload are not listed; no decisions are included."
      security: []
      parameters:
        - { name: school, in: query, required: true, description: "School code or name", schema: { type: string, minLength: 1, maxLength: 80, example: NYU } }
      responses:
        "200": { description: Courses sorted by code, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CreditCourse" } } } } }
        "404": { description: School not in the catalog }
        "422": { $ref: "#/components/responses/PublicInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /credit-check:
    post:
      summary: "Public, no login (ADR 0006): will this external course transfer? Per-course rules R01-R08, R10/R11 and R13 applied with the evaluation's own code; reusable catalog decisions only (never holdout or per-student ones, never courses known only from an upload); otherwise a preliminary estimate (R22). Record-wide rules are returned as caveats."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditCheckInput" }
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/CreditCheckResult" } } } }
        "413": { description: "Body over 64 KB" }
        "422": { $ref: "#/components/responses/PublicInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /credit-chat:
    post:
      summary: "Public, no login (ADR 0006): one chat turn about transfer credit. The model may only call the credit check; only the user's turns are sent to it; a reply that names a BU code other than a decided result, promises credit or states other unit numbers is replaced by a plain summary. Nothing is stored."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditChatInput" }
      responses:
        "200": { description: Reply, content: { application/json: { schema: { $ref: "#/components/schemas/CreditChatReply" } } } }
        "413": { description: "Body over 64 KB" }
        "422": { $ref: "#/components/responses/PublicInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: The AI service failed; use the form }
        "503": { description: No AI service configured; use the form }
  /students:
    get:
      summary: List students
      x-roles: [Student, CreditStaff, Evaluator, Department, Registrar, Advisor]
      responses:
        "200": { description: Students, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Student" } } } } }
  /students/{student_id}/evaluation:
    get:
      summary: Every transcript line with its current status, plus secured vs pending totals
      x-roles: [Student, CreditStaff, Evaluator, Department, Registrar, Advisor]
      parameters: [ { $ref: "#/components/parameters/StudentId" } ]
      responses:
        "200": { description: Evaluation, content: { application/json: { schema: { $ref: "#/components/schemas/StudentEvaluation" } } } }
        "404": { description: Unknown student }
  /students/{student_id}/notifications:
    get:
      summary: "In-app notifications for a student, newest first (at most 50)"
      description: |
        Transcript received, syllabus needed (and each reminder), syllabus received, a decision on one of the student's courses
        (only when it applies to them) and credit posted. Built from what the app already records; shown even when an email
        failed or no mail service is configured. Never includes staff email lists, evaluator names or notes. Reading does not
        mark anything read (staff may look at a student's record). Portal: a student only reaches their own id.
      x-roles: [Student, CreditStaff, Evaluator, Department, Registrar, Advisor]
      parameters: [ { $ref: "#/components/parameters/StudentId" } ]
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { $ref: "#/components/schemas/StudentNotifications" } } } }
        "404": { description: Unknown student }
  /students/{student_id}/notifications/seen:
    post:
      summary: "The student opened their notifications: everything up to now is read"
      x-roles: [Student]
      parameters: [ { $ref: "#/components/parameters/StudentId" } ]
      responses:
        "200": { description: Notifications after marking them read, content: { application/json: { schema: { $ref: "#/components/schemas/StudentNotifications" } } } }
        "404": { description: Unknown student }
        "503": { description: The read state could not be saved }
  /students/{student_id}/transcripts:
    post:
      summary: Upload a transcript PDF; lines are extracted and evaluated
      x-roles: [Student, CreditStaff]
      parameters: [ { $ref: "#/components/parameters/StudentId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: "Extracted and evaluated, or the same file again (upload.duplicate, nothing changed)", content: { application/json: { schema: { $ref: "#/components/schemas/TranscriptUploadResult" } } } }
        "415": { description: Not a PDF (checked by the file's first bytes) }
        "422": { description: "Unreadable or over 30 pages, no readable text, not a transcript (no Institution line), unknown institution, no course lines or more than 60, a course title with instructions aimed at automated systems, or a different Student ID than this student's earlier transcript from the same school (the printed id is never compared with portal ids)" }
  /courses/{ext_id}/syllabus:
    get:
      summary: "The syllabus on file and the requests sent, for the department evaluator next to the AI comparison"
      description: |
        Text as extracted from the PDF (plain text; clients must not render it as HTML), at most 30,000 characters.
        Requests: one entry per student who has this course on their transcript and was asked, with the reminder plan. A Department
        account only sees its own department's courses (403).
      x-roles: [CreditStaff, Evaluator, Department]
      parameters: [ { $ref: "#/components/parameters/ExtId" } ]
      responses:
        "200": { description: Syllabus and requests, content: { application/json: { schema: { $ref: "#/components/schemas/CourseSyllabus" } } } }
        "404": { description: Unknown course }
    post:
      summary: Upload a syllabus for an external course; checked for completeness (outcomes, schedule)
      x-roles: [Student, CreditStaff, Evaluator, Department]
      parameters: [ { $ref: "#/components/parameters/ExtId" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: "Checked; injected sentences are removed and flagged (ADR 0004)", content: { application/json: { schema: { $ref: "#/components/schemas/SyllabusCheck" } } } }
        "415": { description: Not a PDF (checked by the file's first bytes) }
        "422": { description: "Unreadable or over 30 pages, no readable text, not a syllabus (no course code line and no syllabus sections), or a syllabus for a different course" }
        "409": { description: "A syllabus was already uploaded for this course through the app; it can be uploaded only once (seed syllabi do not count; a demo reset clears uploads)" }
  /students/{student_id}/courses/{ext_id}/syllabus-request:
    post:
      summary: Send a syllabus request for one course again (staff). The normal request is automatic after a transcript upload
      description: |
        Step 5 of the process is automatic: after a transcript upload, the student is asked once, in one email, for every
        "maybe" course without a complete syllabus (TranscriptUploadResult.upload.syllabus_request). This route re-sends it
        for one course. A student who registered themselves receives the email at their own address with the
        notification list (SYLLABUS_REQUEST_TO / SYLLABUS_REQUEST_CC) copied; seeded sample students (made-up addresses)
        are never emailed, and the request goes to the notification list. Repeats for the same student and course within
        15 minutes are not re-sent (status already_requested). Without a mail service the request is recorded and the
        status is not_sent.
      x-roles: [Student, CreditStaff, Evaluator, Department]
      parameters: [ { $ref: "#/components/parameters/StudentId" }, { $ref: "#/components/parameters/ExtId" } ]
      responses:
        "201": { description: Request recorded, content: { application/json: { schema: { $ref: "#/components/schemas/SyllabusRequest" } } } }
        "404": { description: Unknown student, or the course is not on this student's transcript }
        "502": { description: The mail service rejected the email }
        "409": { description: A syllabus was already uploaded for this course; nothing to request }
  /syllabus-reminders/run:
    post:
      summary: Send the syllabus reminders that are due now
      description: |
        The API checks on its own every TRANSFERIQ_SYLLABUS_REMINDER_CHECK_MINUTES (default 60). A syllabus that was requested
        and is still missing or incomplete is requested again every TRANSFERIQ_SYLLABUS_REMINDER_DAYS (default 2; 0 = off) after
        the last successful request, at most TRANSFERIQ_SYLLABUS_REMINDER_MAX times (default 7), one email per student.
        Reminders stop when the syllabus is uploaded or the course is decided. Courses never requested get none. Without a mail
        service nothing is sent or recorded (skipped), so an instance that cannot deliver never shifts the schedule. This route
        runs the same check now (demos, external schedulers); running it twice sends nothing twice.
      x-roles: [CreditStaff]
      responses:
        "200":
          description: What was sent
          content:
            application/json:
              schema: { type: object, properties: { students: { type: integer }, courses: { type: array, items: { type: string }, example: ["SYN-24005 PSYCH-UA 25"] }, skipped: { type: string, description: "Why nothing was checked: reminders off, or no mail service configured" } } }
  /courses/{ext_id}/recommendation:
    get:
      summary: AI recommendation for an external course (top-3 BU candidates with evidence)
      x-roles: [CreditStaff, Evaluator, Department]
      parameters: [ { $ref: "#/components/parameters/ExtId" } ]
      responses:
        "200": { description: Recommendation, content: { application/json: { schema: { $ref: "#/components/schemas/Recommendation" } } } }
  /review-queue:
    get:
      summary: Maybe courses awaiting an evaluator decision
      x-roles: [CreditStaff, Evaluator, Department]
      parameters:
        - { name: department, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReviewItem" } } } } }
  /decisions:
    post:
      summary: Record an evaluator decision (Evaluator or Department role)
      x-roles: [Evaluator, Department]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DecisionInput" } } }
      responses:
        "201": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Decision" } } } }
        "403": { description: Role not allowed }
  /decisions/batch:
    post:
      summary: Approve recommendations above 90% as a reviewed batch (one decision logged per course)
      x-roles: [Evaluator, Department]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ext_ids], properties: { ext_ids: { type: array, items: { type: string } }, evaluator: { type: string, maxLength: 80, description: "Demo mode only (required there). Portal and Entra: ignored; the verified sign-in is recorded as \"Name <email>\"" } } }
      responses:
        "201": { description: Saved, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Decision" } } } } }
        "422": { description: An item is at or below the 90% threshold }
  /exports/mybu.csv:
    get:
      summary: MyBU-style posting export of approved courses (Registrar or Credit Evaluation staff)
      x-roles: [Registrar, CreditStaff]
      parameters:
        - { name: student_id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /postings:
    post:
      summary: Post approved courses (Registrar step) - approved lines become posted/secured; returns the MyBU-style CSV rows posted
      x-roles: [Registrar, CreditStaff]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { student_id: { type: string } } }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { type: object, properties: { posted: { type: integer }, csv: { type: string } } } } } }
  /evaluation/metrics:
    get:
      summary: Matcher quality on the held-out decisions (sponsor gates)
      x-roles: [Student, CreditStaff, Evaluator, Department, Registrar, Advisor]
      responses:
        "200": { description: Metrics, content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } } }
  /rules:
    get:
      summary: The rules the engine applies (R01–R24)
      x-roles: [Student, CreditStaff, Evaluator, Department, Registrar, Advisor]
      responses:
        "200": { description: Rules, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Rule" } } } } }
  /reason-codes:
    get:
      summary: Reason codes evaluators can record
      x-roles: [Student, CreditStaff, Evaluator, Department, Registrar, Advisor]
      responses:
        "200": { description: Codes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReasonCode" } } } } }
  /demo/reset:
    post:
      summary: Reset to the seeded demo state (removes decisions made during the demo)
      x-roles: [CreditStaff, Registrar]
      responses:
        "204": { description: Reset }
components:
  securitySchemes:
    demoRole: { type: apiKey, in: header, name: X-Demo-Role }
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    StudentId: { name: student_id, in: path, required: true, schema: { type: string, example: SYN-24001 } }
    ExtId: { name: ext_id, in: path, required: true, description: "School code and course code joined by '|', URL-encoded", schema: { type: string, example: "NYU|PSYCH-UA 10" } }
  responses:
    RateLimited:
      description: "Rate limited: per client (right-most public X-Forwarded-For hop), per-client AI budget, the global AI budget or chat concurrency"
      headers:
        Retry-After: { description: Seconds to wait, schema: { type: integer } }
    PublicInvalid:
      description: "Invalid input. Schema violations return FastAPI's `detail: [ {loc, msg, type} ]`; rule checks (course code, term format, conversation shape) return `detail: string`."
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { oneOf: [ { type: string }, { type: array, items: { type: object } } ] }
  schemas:
    SyllabusRequest:
      type: object
      required: [student_id, ext_id, status, to, cc, requested_at]
      properties:
        student_id: { type: string }
        ext_id: { type: string }
        status: { type: string, enum: [sent, not_sent, already_requested], description: "not_sent = no mail service configured yet; the request is still recorded" }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        requested_at: { type: string, format: date-time }
    Student:
      type: object
      properties:
        student_id: { type: string }
        name: { type: string }
        intended_major: { type: string }
        bu_school: { type: string, example: "College of Arts & Sciences" }
        bu_start_term: { type: string }
        email: { type: string, format: email, description: "Contact (personal data; never sent to an AI service). Synthetic data uses example.edu" }
        phone: { type: string, example: "617-555-0122", description: "Contact (personal data; never sent to an AI service)" }
        address: { type: string, description: "Postal address, one text field (personal data; never sent to an AI service)" }
        previous_school: { type: string, nullable: true, description: "school_code of the most recently attended school (latest transcript term); full history is in the transcript lines" }
        previous_school_name: { type: string, nullable: true, example: "New York University" }
    CourseEvaluation:
      type: object
      properties:
        ext_id: { type: string }
        school_code: { type: string }
        term: { type: string }
        course_code: { type: string }
        title: { type: string }
        credits: { type: number }
        calendar: { type: string, enum: [Semester, Quarter] }
        grade: { type: string }
        state: { type: string, enum: [matched, approved, posted, posted_no_credit, maybe_review, maybe_ts, maybe_tm, pending_age], description: "approved = evaluator approved, awaiting posting (student still sees TP; counts as pending); posted = secured" }
        status: { type: string, description: Plain-words status }
        bu_status_code: { type: string, enum: [T, TX, TP, TS, TM], description: BU portal code }
        bu_course: { type: string, nullable: true }
        units: { type: number, description: Units posted or approved (0 while pending) }
        units_if_approved: { type: number }
        reason_code: { type: string }
        flags: { type: array, items: { type: string } }
        next_step: { type: string }
        ai_tier: { type: string, nullable: true }
        ai_overlap_pct: { type: integer, nullable: true }
        syllabus_uploaded: { type: boolean, description: "A syllabus was uploaded for this course through the app; the UI hides Upload syllabus (upload once)" }
    StudentEvaluation:
      type: object
      properties:
        student: { $ref: "#/components/schemas/Student" }
        lines: { type: array, items: { $ref: "#/components/schemas/CourseEvaluation" } }
        totals:
          type: object
          properties:
            secured_units: { type: number, description: "Matched from the equivalency table or posted" }
            approved_units: { type: number, description: "Approved, awaiting posting (included in pending_units)" }
            pending_units: { type: number }
            no_credit_lines: { type: integer }
            cap_units: { type: number, example: 68 }
    CreditSchool:
      type: object
      required: [school_code, name, calendar]
      properties:
        school_code: { type: string, example: NYU }
        name: { type: string }
        calendar: { type: string, enum: [Semester, Quarter] }
    CreditCourse:
      type: object
      required: [course_code, title, credits]
      properties:
        course_code: { type: string, example: "PSYCH-UA 10" }
        title: { type: string }
        credits: { type: number }
    CreditCheckInput:
      type: object
      required: [school]
      additionalProperties: false
      properties:
        school: { type: string, minLength: 1, maxLength: 80, description: "School code or name, e.g. NYU" }
        course_code: { type: string, maxLength: 20, pattern: "^(([A-Za-z]{2,8}(-[A-Za-z]{2})?\\s*\\d{1,4}[A-Za-z]?)|[A-Za-z]{2,8}(-[A-Za-z]{2})?|\\d{1,4})?$", example: "PSYCH-UA 10", description: "A full code, or just the department ('CS') or number ('3000') to get suggestions" }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000, description: "Untrusted; injected sentences are removed" }
        grade: { type: string, maxLength: 3, description: "Letter grade (A..F with +/-) or P/NP/S/U. Empty = unknown: a decided result then assumes C or better." }
        credits: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 20 }
        term: { type: string, maxLength: 20, pattern: "^((Winter|Spring|Summer|Fall) \\d{4})?$", example: "Fall 2024" }
        start_term: { type: string, maxLength: 20, default: "Fall 2026" }
    CreditCheckResult:
      type: object
      required: [kind, message, bu_course, units, reason_code, estimate, caveats]
      properties:
        kind: { type: string, enum: [decided_equivalent, decided_elective, not_transferable, pending_review, needs_evaluation, unknown_school, unknown_course], description: "Only an exact school code or name is used. A partial school (\"NE\", \"northeastern\") is never auto-picked: unknown_school with school_suggestions for the student to confirm" }
        message: { type: string }
        school_code: { type: string, description: "Absent for unknown_school" }
        school_name: { type: string }
        course_code: { type: string, nullable: true }
        title: { type: string, nullable: true }
        calendar: { type: string, enum: [Semester, Quarter] }
        credits: { type: number, nullable: true }
        bu_course: { type: string, nullable: true }
        bu_title: { type: string, nullable: true, description: "decided_equivalent only" }
        units: { type: number, nullable: true, description: "Converted units (R08), before the record-wide 68-unit cap; 0 when not transferable" }
        reason_code: { type: string, nullable: true }
        estimate:
          type: object
          nullable: true
          description: "Only for needs_evaluation: always preliminary, never a promise of credit"
          properties:
            preliminary: { type: boolean }
            candidates: { type: array, maxItems: 3, items: { type: object, properties: { bu_code: { type: string }, title: { type: string }, overlap_pct: { type: integer } } } }
            engine: { type: string, enum: [azure-openai, offline-fallback] }
            injection_detected: { type: boolean }
        caveats: { type: array, items: { type: string }, description: "Record-wide rules not applied; an R11 same-year conflict adds a first caveat" }
        suggestions: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/CreditCourse" }, description: "Catalog courses (never courses known only from uploads) when the code is a department alone (\"CS\": exactly that department), a number alone (\"3000\"), the start of a code (\"CS 30\"), a full code not in the catalog (courses starting with it), or no code but a title (title match). Their credits are the other school's, not BU units" }
        school_suggestions: { type: array, items: { type: object, required: [school_code, name], properties: { school_code: { type: string }, name: { type: string } } }, description: "unknown_school only: the schools the input could mean (even a single one, to confirm), or all catalog schools" }
    ChatTurn:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 1500, description: "user turns at most 600 characters, all turns together at most 9000 (422 otherwise); assistant turns are earlier replies" }
        signature: { type: string, pattern: "^[0-9a-f]{64}$", description: "assistant turns: the signature returned with that reply. It is bound to the user turn just before it; only correctly signed assistant turns reach the model (sanitised), otherwise all assistant turns are dropped" }
    CreditChatInput:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages: { type: array, minItems: 1, maxItems: 12, items: { $ref: "#/components/schemas/ChatTurn" }, description: "The last turn must be the user's" }
    CreditChatReply:
      type: object
      required: [reply, results, grounded, signature]
      properties:
        reply: { type: string, maxLength: 1500 }
        signature: { type: string, description: "HMAC of reply; send it back with this assistant turn" }
        results: { type: array, items: { $ref: "#/components/schemas/CreditCheckResult" }, description: "The facts behind the reply; the page shows these as the source of truth" }
        grounded: { type: boolean, description: "false = the model's text was replaced by a summary of the results" }
    TranscriptUploadResult:
      allOf:
        - $ref: "#/components/schemas/StudentEvaluation"
        - type: object
          properties:
            upload:
              type: object
              properties:
                transcript_id: { type: string, example: "TR-3f9a1c2b7d10" }
                school_code: { type: string }
                school_name: { type: string }
                school_student_id: { type: string, nullable: true, description: "Student ID printed on the transcript (the previous school's id)" }
                duplicate: { type: boolean, description: "Same file as the latest transcript from this school; nothing changed" }
                replaced: { type: boolean, description: "This school already had course lines; they were replaced" }
                added: { type: array, items: { type: string }, example: ["PSYCH-UA 30 (Fall 2025)"] }
                removed: { type: array, items: { type: string } }
                updated: { type: array, items: { type: string }, description: "Same course and term, new grade or credits" }
                syllabus_request:
                  type: object
                  description: "Step 5, automatic: one email asking for the syllabus of every maybe course without a complete one (not repeated for courses already requested)"
                  properties:
                    status: { type: string, enum: [none, sent, not_sent, failed], description: "none: nothing to ask for; not_sent: no mail service, recorded only; failed: recorded, the mail service refused" }
                    courses: { type: array, items: { type: string } }
                    to: { type: array, items: { type: string } }
                    cc: { type: array, items: { type: string } }
                    emailed_student: { type: boolean, description: "false for seeded sample students: the notification list receives it" }
    StudentNotifications:
      type: object
      required: [items, unread]
      properties:
        unread: { type: integer }
        seen_at: { type: string, format: date-time, nullable: true, description: "Read up to this time (null: never opened)" }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, kind, title, body, at, unread]
            properties:
              id: { type: string }
              kind: { type: string, enum: [transcript, syllabus_request, syllabus_reminder, syllabus_received, decision, posted] }
              title: { type: string, example: "Syllabus needed for NYU PSYCH-UA 25" }
              body: { type: string }
              at: { type: string, format: date-time }
              ext_id: { type: string, nullable: true }
              unread: { type: boolean }
    CourseSyllabus:
      type: object
      required: [ext_id, state, requests]
      properties:
        ext_id: { type: string }
        state: { type: string, enum: [complete, incomplete, missing] }
        source: { type: string, nullable: true, enum: [upload, on file], description: "upload: uploaded through the app; on file: received earlier (sample data)" }
        uploaded_at: { type: string, format: date-time, nullable: true }
        injection_detected: { type: boolean }
        text: { type: string, nullable: true, description: "Plain text extracted from the PDF; never render as HTML" }
        truncated: { type: boolean }
        catalogue_outcomes:
          type: array
          items: { type: string }
          description: "The course's learning outcomes from the institution's catalogue record (what the matcher compares when the syllabus lists none). Plain text."
        requests:
          type: array
          items:
            type: object
            properties:
              student_id: { type: string }
              student_name: { type: string }
              requested_at: { type: string, format: date-time, description: "First request" }
              last_sent_at: { type: string, format: date-time, nullable: true, description: "Latest successful request or reminder" }
              reminders: { type: integer, description: "Reminders sent so far" }
              next_reminder_at: { type: string, format: date-time, nullable: true, description: "null: no more reminders (syllabus arrived, the maximum was reached, or reminders are off)" }
              status: { type: string, enum: [sent, not_sent, failed], description: "Of the latest attempt" }
              automatic: { type: boolean }
              emailed_student: { type: boolean }
    Candidate:
      type: object
      properties:
        bu_code: { type: string }
        title: { type: string }
        overlap_pct: { type: integer }
        tier: { type: string, enum: [equivalent, evaluator_decides, elective] }
        covered: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        description_match_pct:
          type: integer
          nullable: true
          description: "0-100: how much of this BU course's description the external course description covers (Azure OpenAI, offline topic match as fallback). Display only: never changes overlap_pct, tier or the suggested decision. Null when there is nothing to compare."
      type: object
      properties:
        ext_id: { type: string }
        preliminary: { type: boolean, description: True when based on a description only (not decidable) }
        engine: { type: string, enum: [azure-openai, offline-fallback] }
        candidates: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        suggested_decision: { type: string, enum: [Equivalent, Elective, Evaluator decides] }
        suggested_code: { type: string }
        confidence_pct: { type: integer }
        injection_detected: { type: boolean }
        past_decisions: { type: array, items: { $ref: "#/components/schemas/Decision" } }
    ReviewItem:
      type: object
      properties:
        ext_id: { type: string }
        course_code: { type: string }
        title: { type: string }
        school_code: { type: string }
        department: { type: string }
        students: { type: array, items: { type: string } }
        syllabus_state: { type: string, enum: [complete, incomplete, missing] }
        top_candidate: { $ref: "#/components/schemas/Candidate" }
        confidence_pct: { type: integer }
        batch_eligible: { type: boolean }
    DecisionInput:
      type: object
      required: [ext_id, decision, bu_course, reason_code]
      properties:
        ext_id: { type: string }
        decision: { type: string, enum: [Equivalent, Elective, No credit] }
        bu_course: { type: string, pattern: "^(CAS [A-Z]{2} [0-9]{3}|CAS [A-Z]{2} [12]TR|TFRGEN 1TR|TFRGEN NOCRDT)$", description: "Must be a known BU course, a TR elective code, or TFRGEN NOCRDT; must agree with decision" }
        reason_code: { type: string, description: "Must exist in /reason-codes and match the decision" }
        reusable: { type: boolean, default: true }
        evaluator: { type: string, maxLength: 80, description: "Who decided. Input: demo mode only (422 when empty there). Portal and Entra: ignored; the verified sign-in is recorded as \"Name <email>\" (email, or the Entra sign-in name, makes it unique)" }
        catalog_year: { type: string, example: 2025-26 }
        note: { type: string }
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionInput"
        - type: object
          properties:
            decision_id: { type: string }
            decided_at: { type: string, format: date-time }
            ai_suggestion: { type: string, nullable: true }
            ai_agreed: { type: boolean, nullable: true }
    SyllabusCheck:
      type: object
      properties:
        ext_id: { type: string }
        complete: { type: boolean }
        missing_sections: { type: array, items: { type: string } }
        status_code: { type: string, enum: [TP, TM] }
        injection_detected: { type: boolean }
    Metrics:
      type: object
      properties:
        engine: { type: string }
        n: { type: integer }
        top1_agreement: { type: number, description: "Top-1 candidate agreement (gate metric)" }
        strict_agreement: { type: number, description: "Suggested decision equals recorded decision; must be shown next to top1_agreement" }
        deferrals: { type: integer, description: "Holdout items where the matcher deferred to the evaluator (50-79% band)" }
        wrong_credit_rate: { type: number }
        gates_met: { type: boolean }
        by_tier: { type: object, additionalProperties: { type: object } }
    ReasonCode:
      type: object
      properties:
        reason_code: { type: string }
        decision: { type: string }
        meaning: { type: string }
    Rule:
      type: object
      properties:
        rule_id: { type: string }
        category: { type: string }
        rule: { type: string }
        reason_code: { type: string }
