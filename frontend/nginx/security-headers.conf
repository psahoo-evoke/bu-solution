# Included in every location of default.conf.template: nginx drops server-level add_header lines in any location
# that has its own add_header, so the headers live here. Mirrors public/staticwebapp.config.json.
# login.microsoftonline.com: MSAL token calls (connect-src) and silent token renewal (frame-src), Entra mode.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
